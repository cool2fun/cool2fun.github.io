<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
    #wrap { display: flex; justify-content: center; align-items: center; width: 100%; min-height: 250px; }
  </style>
  <script async src="https://securepubads.g.doubleclick.net/tag/js/gpt.js" crossorigin="anonymous"></script>
  <script>
    window.googletag = window.googletag || { cmd: [] };
    (function () {
      var topUrl = null;
      var topHost = null;
      try {
        var raw = new URLSearchParams(window.location.search).get('topUrl');
        if (raw) { topUrl = new URL(raw).href; topHost = new URL(raw).hostname; }
      } catch (e) {}

      googletag.cmd.push(function () {
        var DIV = 'gpt-300x600';
        var pubads = googletag.pubads();

        var mapping = googletag.sizeMapping()
          .addSize([768, 0], [[300, 600], [160, 600], [300, 250]])
          .addSize([0, 0],   [[300, 250], [300, 50]])
          .build();

        googletag.defineSlot('/23136362493/300x600',
          [[300, 600], [160, 600], [300, 250], [300, 50]], DIV)
          .defineSizeMapping(mapping)
          .setForceSafeFrame(true)
          .addService(pubads);

        if (topUrl)  pubads.set('page_url', topUrl);
        if (topHost) pubads.setTargeting('ref_host', topHost);

        pubads.setTargeting('kw', [
          'car games', 'racing games', 'driving games', 'online games',
          'free games', 'browser games', 'car simulator', 'racing simulator',
          'speed games', 'multiplayer racing'
        ]);
        pubads.setTargeting('cat', ['games', 'racing', 'driving']);
        pubads.setTargeting('content', 'game');

        pubads.setCentering(true);
        pubads.enableSingleRequest();
        pubads.enableLazyLoad({ fetchMarginPercent: 500, renderMarginPercent: 200, mobileScaling: 2.0 });
        pubads.collapseEmptyDivs(false);
        googletag.enableServices();
        googletag.display(DIV);
      });
    })();
  </script>
</head>
<body>
  <div id="wrap">
    <div id="gpt-300x600"></div>
  </div>
</body>
</html>
