      var topUrl = null;
      try {
        var raw = new URLSearchParams(window.location.search).get('topUrl');
        if (raw) topUrl = new URL(raw).href;
      } catch (e) {}

      googletag.cmd.push(function () {
        var DIV = 'gpt-970x90';

        var mapping = googletag.sizeMapping()
          .addSize([992, 0], [[970, 90], [750, 100], [728, 90]])
          .addSize([768, 0], [[728, 90], [468, 60]])
          .addSize([0, 0],   [[320, 50], [300, 50]])

          .defineSizeMapping(mapping)
          .setForceSafeFrame(true)
          .addService(pubads);

        if (topUrl) {
          pubads.set('page_url', topUrl);
          try { pubads.setTargeting('ref_host', new URL(topUrl).hostname); } catch (e) {}
        }

        pubads.setCentering(true);
        pubads.enableSingleRequest();
        pubads.collapseEmptyDivs(false);
