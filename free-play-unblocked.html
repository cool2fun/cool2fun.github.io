<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AdsKeeper Optimized</title>
  
  <!-- 1. TĂNG TỐC KẾT NỐI MÁY CHỦ QUẢNG CÁO (Preconnect & DNS Prefetch) -->
  <link rel="preconnect" href="https://jsc.adskeeper.com" crossorigin>
  <link rel="dns-prefetch" href="https://jsc.adskeeper.com">
  <link rel="preconnect" href="https://servicer.adskeeper.com" crossorigin>
  <link rel="dns-prefetch" href="https://servicer.adskeeper.com">

  <!-- 2. CSS TỐI ƯU KHÔNG GIAN ĐỂ HIỂN THỊ ĐƯỢC NHIỀU QC NHẤT -->
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: transparent;
      overflow: hidden; /* Xóa bỏ thanh cuộn */
    }
    div[data-widget-id="2089003"] {
      width: 100% !important;
      min-height: 300px;
    }
  </style>

  <!-- Script gốc AdsKeeper -->
  <script src="https://jsc.adskeeper.com/site/1113039.js" async></script>
</head>
<body>

  <!-- Khung chứa quảng cáo -->
  <div data-type="_mgwidget" data-widget-id="2089003"></div>

  <!-- 3. SCRIPT KÍCH HOẠT VÀ TỰ ĐỘNG TẢI LẠI (AUTO-REFRESH) -->
  <script>
    // Khởi tạo tải quảng cáo ban đầu
    (function(w,q){w[q]=w[q]||[];w[q].push(["_mgc.load"])})(window,"_mgq");

    // Tự động kéo thêm lượt quảng cáo mới mỗi 35 giây (chỉ chạy khi người dùng đang xem tab)
    setInterval(function() {
      if (!document.hidden && window._mgq) {
        window._mgq.push(["_mgc.load"]);
      }
    }, 35000); // 35000ms = 35 giây
  </script>

</body>
</html>
