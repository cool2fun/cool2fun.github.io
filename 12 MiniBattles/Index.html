<script id="splash-sponsor-domain-v1">
(function(){
  /* 12 MiniBattles: the sponsor intro (obj_sponsorgrande step handler) reads
     document.domain and only calls room_goto_next when it contains a known
     partner site (twoplayergames / crazygames / etc.). On any other domain the
     intro never advances and the game freezes on the splash. Spoof document.domain
     so the substring check passes and the intro auto-advances to the menu.
     Only override the getter; keep the setter a safe no-op (Apps Script sandbox
     throws SecurityError on real document.domain assignment). */
  try{
    var descriptor=Object.getOwnPropertyDescriptor(Document.prototype,'domain');
    if(descriptor&&typeof descriptor.get==='function'){
      Object.defineProperty(document,'domain',{
        configurable:true,
        enumerable:Boolean(descriptor.enumerable),
        get:function(){ return 'twoplayergames.org'; },
        set:function(){ /* no-op */ }
      });
      window.__sponsorDomainShim=true;
    }
  }catch(_){}
})();
</script>

(function(){
