<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>99 Balls</title>
  
  <!-- Tải Google IMA SDK để đọc file VAST -->
  <script src="https://imasdk.googleapis.com/js/sdkloader/ima3.js"></script>

  <style>
    :root {
      --bg-color: #0f172a;
      --card-color: #1e293b;
      --accent-color: #facc15;
      --accent-hover: #eab308;
      --text-color: #ffffff;
      --radius: 8px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; background: transparent; }
    body {
      height: 100vh;
      overflow: hidden;
      font-family: Arial, sans-serif;
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      padding: 3px;
    }
    .stage {
      position: relative;
      flex: 1;
      min-height: 0;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      border: 3px solid #334155;
      display: flex;
    }
    .stage iframe {
      flex: 1;
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background: #000;
    }
    .overlay {
      position: absolute;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      background: var(--card-color);
    }
    .game-title { font-size: 32px; font-weight: 800; color: var(--text-color); text-align: center; }
    .play-row { display: flex; align-items: center; gap: 16px; }
    .play-btn {
      display: inline-flex; align-items: center; gap: 12px;
      padding: 16px 44px; font-size: 18px; font-weight: bold;
      color: #0f172a; background-color: var(--accent-color);
      border: 2px solid transparent; border-radius: var(--radius);
      cursor: pointer; transition: transform 0.1s; text-transform: uppercase;
    }
    .play-btn:hover { background-color: var(--accent-hover); transform: scale(1.03); }
    .play-btn:active { transform: scale(0.98); }
    .controls { display: flex; justify-content: flex-end; padding-top: 10px; flex-shrink: 0; }
    .fs-btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 9px 18px; font-size: 13px; font-weight: 700;
      text-transform: uppercase; color: var(--text-color);
      background: darkslateblue; border: 1px solid #334155;
      border-radius: var(--radius); cursor: pointer;
    }

    /* Khung Quảng cáo Video IMA */
    #adModal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 999999;
      background: rgba(0, 0, 0, 0.95);
      align-items: center;
      justify-content: center;
      flex-direction: column;
    }
    #adContainer {
      position: relative;
      width: 640px;
      height: 360px;
      background: #000;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    #videoElement {
      width: 100%;
      height: 100%;
      background-color: #000;
    }
    #closeAdBtn {
      display: none; /* Ẩn nút đóng lúc đầu, đợi hết quảng cáo mới hiện */
      margin-top: 20px;
      padding: 10px 30px;
      background: #ef4444;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    #closeAdBtn:hover { background: #dc2626; }
    
    @media (max-width: 700px) {
      #adContainer { width: 95vw; height: 53.4vw; } /* Maintain 16:9 ratio */
    }
  </style>
</head>
<body>

  <!-- Modal Quảng Cáo với Video Player -->
  <div id="adModal">
    <div id="adContainer">
      <video id="videoElement"></video>
    </div>
    <button id="closeAdBtn">Bỏ qua quảng cáo ✕</button>
  </div>

  <div class="stage" id="stage">
    <iframe id="gameIframe" data-src="https://assets.classroom.support/99-balls/" title="99 Balls"></iframe>
    <div class="overlay" id="overlay">
      <h1 class="game-title">99 Balls</h1>
      <div class="play-row">
        <button class="play-btn" id="startBtn">PLAY NOW</button>
      </div>
    </div>
  </div>

<script>
    var gameIframe = document.getElementById('gameIframe');
    var overlay = document.getElementById('overlay');
    var startBtn = document.getElementById('startBtn');
    
    var adModal = document.getElementById('adModal');
    var closeAdBtn = document.getElementById('closeAdBtn');
    var videoElement = document.getElementById('videoElement');
    var adContainer = document.getElementById('adContainer');
    
    var hasStarted = false;
    var adPlayed = false;
    var nonLinearTimeout; // Biến đếm ngược cho banner tĩnh

    // Biến của Google IMA
    var adDisplayContainer;
    var adsLoader;
    var adsManager;

    // Đường link VAST
    var VAST_URL = "https://pubads.g.doubleclick.net/gampad/ads?iu=/23332761288/cool2fun.github.io/cool2fun.github.io_vast&description_url=http%3A%2F%2Fcool2fun.github.io&tfcd=0&npa=0&sz=400x300%7C640x360%7C640x480&gdfp_req=1&unviewed_position_start=1&output=vast&env=vp&impl=s&vpmute=1&plcmt=2&correlator=" + Date.now();

    function initIMA() {
      adDisplayContainer = new google.ima.AdDisplayContainer(adContainer, videoElement);
      adsLoader = new google.ima.AdsLoader(adDisplayContainer);
      
      adsLoader.addEventListener(google.ima.AdsManagerLoadedEvent.Type.ADS_MANAGER_LOADED, onAdsManagerLoaded, false);
      adsLoader.addEventListener(google.ima.AdErrorEvent.Type.AD_ERROR, onAdError, false);
    }

    function playAds() {
      if(adPlayed) return; 
      
      adModal.style.display = 'flex';
      adDisplayContainer.initialize();

      var adsRequest = new google.ima.AdsRequest();
      adsRequest.adTagUrl = VAST_URL;
      
      adsRequest.linearAdSlotWidth = adContainer.offsetWidth;
      adsRequest.linearAdSlotHeight = adContainer.offsetHeight;
      adsRequest.nonLinearAdSlotWidth = adContainer.offsetWidth;
      adsRequest.nonLinearAdSlotHeight = adContainer.offsetHeight;

      adsLoader.requestAds(adsRequest);
      
      // Luôn hiện nút tắt dự phòng sau 3 giây dù quảng cáo là dạng gì
      setTimeout(function() {
          closeAdBtn.style.display = 'block';
      }, 3000);
    }

    function onAdsManagerLoaded(adsManagerLoadedEvent) {
      adsManager = adsManagerLoadedEvent.getAdsManager(videoElement);
      
      adsManager.addEventListener(google.ima.AdErrorEvent.Type.AD_ERROR, onAdError);
      
      // Bắt sự kiện khi quảng cáo BẮT ĐẦU phát
      adsManager.addEventListener(google.ima.AdEvent.Type.STARTED, function(adEvent) {
        var ad = adEvent.getAd();
        // Kiểm tra xem đây có phải là Video không
        if (!ad.isLinear()) {
          // Nếu không phải Video (là Banner tĩnh như trong ảnh)
          // Đặt đồng hồ đếm ngược tự đóng sau 5 giây
          nonLinearTimeout = setTimeout(function() {
             closeAdAndStartGame();
          }, 5000); 
        }
      });

      // Nếu là Video thì đợi chạy xong sự kiện này mới đóng
      adsManager.addEventListener(google.ima.AdEvent.Type.ALL_ADS_COMPLETED, function() {
        closeAdAndStartGame();
      });

      try {
        adsManager.init(adContainer.offsetWidth, adContainer.offsetHeight, google.ima.ViewMode.NORMAL);
        adsManager.start();
      } catch (adError) {
        onAdError();
      }
    }

    function onAdError(adErrorEvent) {
      if(adsManager) { adsManager.destroy(); }
      closeAdAndStartGame();
    }

    function closeAdAndStartGame() {
      // Xóa đồng hồ đếm ngược nếu có
      if (nonLinearTimeout) {
          clearTimeout(nonLinearTimeout);
      }
      
      adModal.style.display = 'none';
      if(adsManager) { adsManager.destroy(); } // Hủy quảng cáo hoàn toàn
      
      if (!hasStarted) {
        hasStarted = true;
        var src = gameIframe.getAttribute('data-src');
        if (src) gameIframe.src = src;
        overlay.style.display = 'none';
      }
    }

    startBtn.addEventListener('click', function() {
      if (!adPlayed) {
        initIMA();
        playAds();
        adPlayed = true;
      } else {
        closeAdAndStartGame();
      }
    });

    closeAdBtn.addEventListener('click', function() {
      closeAdAndStartGame();
    });

  </script>
</body>
</html>
